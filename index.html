<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="動画ストック">
<title>あん庵 動画ストック</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="app.css?v=7">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><span class="mark">庵</span>動画ストック</div>
    <button class="top-btn" id="openGrid" aria-label="一覧で見る">
      <svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>
    </button>
  </header>
  <nav class="chips" id="chips" aria-label="絞り込み"></nav>

  <main class="feed" id="feed" aria-live="polite"></main>

  <div class="empty" id="empty" hidden>
    <p>この条件の動画はありません</p>
    <button class="ghost" data-filter="all">すべて表示</button>
  </div>
</div>

<!-- 一覧 -->
<section class="sheet grid-sheet" id="grid" hidden aria-label="動画一覧">
  <div class="sheet-head">
    <h2>動画一覧 <small id="gridCount"></small></h2>
    <button class="close" data-close aria-label="閉じる">×</button>
  </div>
  <div class="grid-tools">
    <label class="genre-sel"><span>ジャンル</span><select id="gridGenre" aria-label="ジャンルで絞り込む"></select></label>
  </div>
  <div class="grid" id="gridList"></div>
</section>

<!-- 保存 -->
<div class="backdrop" id="backdrop" hidden></div>
<section class="sheet save-sheet" id="save" hidden aria-label="保存">
  <div class="sheet-head">
    <h2 id="saveTitle">保存する</h2>
    <button class="close" data-close aria-label="閉じる">×</button>
  </div>
  <p class="quality">元のデータのまま保存します（<span id="saveRes">1080×1920</span>・画質の劣化なし）</p>
  <div id="saveOptions"></div>
  <p class="howto" id="howto"></p>
</section>

<!-- インスタでの見え方 -->
<section class="ig" id="ig" hidden aria-label="インスタでの見え方">
  <div class="ig-bar">
    <div class="ig-tabs" role="tablist">
      <button data-ig="story" aria-pressed="true">ストーリーズ</button>
      <button data-ig="reel" aria-pressed="false">リール</button>
      <button data-ig="grid" aria-pressed="false">プロフィール</button>
    </div>
    <button class="close" data-close aria-label="閉じる">×</button>
  </div>
  <div class="ig-stage"><div class="ig-screen" id="igScreen" data-mode="story">
    <div class="ig-status"><span>9:41</span><span class="ig-bat"></span></div>
    <div class="ig-media" id="igMedia">
      <div class="ig-safe" aria-hidden="true">
        <i class="z top"></i><i class="z bottom"></i><i class="z right"></i>
      </div>
      <!-- ストーリーズの表示 -->
      <div class="ig-ui ui-story">
        <div class="st-prog"><i></i></div>
        <div class="st-head"><span class="av">庵</span><b>あん庵</b><span class="dim">1時間</span><span class="sp"></span><span class="ico dots"></span><span class="ico x"></span></div>
      </div>
      <!-- リールの表示 -->
      <div class="ig-ui ui-reel">
        <div class="rl-top"><b>リール</b><span class="ico cam"></span></div>
        <div class="rl-side">
          <span><i class="ico heart"></i>1,204</span><span><i class="ico bubble"></i>36</span>
          <span><i class="ico plane"></i>88</span><span><i class="ico dots"></i></span><span class="rl-disc"></span>
        </div>
        <div class="rl-info">
          <div class="rl-user"><span class="av">庵</span><b>あん庵</b><span class="fl">フォロー</span></div>
          <p class="rl-cap" id="igCap"></p>
          <div class="rl-aud">♪ あん庵・オリジナル音源</div>
        </div>
        <div class="rl-prog"><i></i></div>
      </div>
      <div class="ig-paused" aria-hidden="true"></div>
    </div>
    <div class="ig-below ui-story"><span class="msg">メッセージを送信</span><span class="ico heart"></span><span class="ico plane"></span></div>
    <div class="ig-below ui-reel ig-nav"><span class="ico home"></span><span class="ico search"></span><span class="ico plus"></span><span class="ico reel on"></span><span class="av sm">庵</span></div>
    <!-- プロフィール一覧 -->
    <div class="ig-prof">
      <div class="pf-head"><span class="av lg">庵</span><div><b>あん庵</b><div class="pf-nums"><span><b>128</b>投稿</span><span><b>2,450</b>フォロワー</span><span><b>180</b>フォロー中</span></div></div></div>
      <div class="pf-tabs"><span class="on">投稿</span><span>リール</span></div>
      <div class="pf-grid" id="igGrid"></div>
    </div>
  </div></div>
  <div class="ig-foot">
    <p class="ig-note"><b class="ig-pos" id="igPos"></b><span id="igNote"></span></p>
    <div class="ig-ctl">
      <label class="ig-chk"><input type="checkbox" id="igSafeChk"> 隠れる所を表示</label>
      <button class="ghost" id="igSound"></button>
      <button class="ig-save" id="igSave"><svg viewBox="0 0 24 24"><path d="M12 3a1 1 0 0 1 1 1v9.6l3.3-3.3a1 1 0 1 1 1.4 1.4l-5 5a1 1 0 0 1-1.4 0l-5-5a1 1 0 1 1 1.4-1.4L11 13.6V4a1 1 0 0 1 1-1zM5 19h14a1 1 0 1 1 0 2H5a1 1 0 1 1 0-2z"/></svg>保存して使う</button>
    </div>
  </div>
</section>

<div class="toast" id="toast" role="status" hidden></div>

<script src="app.js?v=7"></script>
</body>
</html>
