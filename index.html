<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="動画ストック">
<title>あん庵 動画ストック</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><span class="mark">庵</span>動画ストック</div>
    <button class="top-btn" id="openGrid" aria-label="一覧で見る">
      <svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>
    </button>
  </header>
  <nav class="chips" id="chips" aria-label="絞り込み"></nav>

  <main class="feed" id="feed" aria-live="polite"></main>

  <div class="empty" id="empty" hidden>
    <p>この条件の動画はありません</p>
    <button class="ghost" data-filter="all">すべて表示</button>
  </div>
</div>

<!-- 一覧 -->
<section class="sheet grid-sheet" id="grid" hidden aria-label="動画一覧">
  <div class="sheet-head">
    <h2>動画一覧 <small id="gridCount"></small></h2>
    <button class="close" data-close aria-label="閉じる">×</button>
  </div>
  <div class="grid" id="gridList"></div>
</section>

<!-- 保存 -->
<div class="backdrop" id="backdrop" hidden></div>
<section class="sheet save-sheet" id="save" hidden aria-label="保存">
  <div class="sheet-head">
    <h2 id="saveTitle">保存する</h2>
    <button class="close" data-close aria-label="閉じる">×</button>
  </div>
  <p class="quality">元のデータのまま保存します（<span id="saveRes">1080×1920</span>・画質の劣化なし）</p>
  <div id="saveOptions"></div>
  <p class="howto" id="howto"></p>
</section>

<div class="toast" id="toast" role="status" hidden></div>

<script src="app.js"></script>
</body>
</html>
